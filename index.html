<!DOCTYPE html>
<html>
<head>
    <!-- Load Telegram's Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Make the iframe take up the whole screen seamlessly */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe id="google-form"></iframe>

    <script>
        // 1. Silently grab the user's Telegram data
        const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        const identifier = tgUser.username || tgUser.id; // Fallback to ID if they don't have a username

        // 2. Your Google Form Pre-filled Link base
        // Replace 'entry.123456789' with your actual pre-filled field ID
        const formBase = "https://docs.google.com/forms/d/e/1FAIpQLSdTeDuykoY8ApKataWujWo4iUCG6yIFU18asMnIMpoBMm74fw/viewform";
        const prefillTracker = "?usp=pp_url&entry.196978520" + identifier;

        // 3. Load the Google Form into the iframe with the tracker attached
        document.getElementById("google-form").src = formBase + prefillTracker;
    </script>
</body>
</html>
